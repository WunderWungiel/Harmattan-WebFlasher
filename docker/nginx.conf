# Static server for the web flasher, same behaviour as serve.py: caching disabled.
server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    # PROTOCOL.md is linked from the page; show it instead of downloading it
    default_type text/plain;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;

    location / {
        try_files $uri $uri/ =404;
    }
}
